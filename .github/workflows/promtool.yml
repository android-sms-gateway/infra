name: Prometheus Rules

on:
  push:
    branches: [master]
    paths:
      - "prometheus/**"
      - ".github/workflows/promtool.yml"
  pull_request:
    paths:
      - "prometheus/**"
      - ".github/workflows/promtool.yml"

permissions:
  contents: read

jobs:
  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            prom/prometheus:v3 check rules prometheus/alert.rules.yml prometheus/rules/*.yml

      - name: Test alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            prom/prometheus:v3 test rules prometheus/tests/alert.rules.test.yml
